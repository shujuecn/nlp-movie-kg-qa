[project]
name = "nlp-movie-kg-qa"
version = "0.1.0"
description = "周星驰电影知识图谱问答系统：NetworkX 图谱 + FAISS 检索 + silra API 理解生成的教学项目"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# 依赖以 requirements.txt 为准（本仓库不作为安装包构建，仅承载元数据与工具配置）

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations
    "RUF", # ruff 自有规则
]
ignore = [
    "RUF001", # 中文字符串里的全角标点是正常的
    "RUF002", # 中文 docstring 里的全角标点是正常的
    "RUF003", # 中文注释里的全角标点是正常的
    "ANN401", # LLM 返回的 JSON、Gradio 组件等类型多样，统一用 Any 表达
]

[tool.ruff.lint.per-file-ignores]
# kgqa/webapp.py 的中文 docstring 与界面文案常有超长行，不做 E501 检查。
"kgqa/webapp.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
